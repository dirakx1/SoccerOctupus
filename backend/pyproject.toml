[project]
name = "fifaoctopus"
version = "0.1.0"
description = "FIFA World Cup 2026 Swarm Prediction Engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "openai>=1.30",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
