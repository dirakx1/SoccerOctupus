[project]
name = "fifaoctopus"
version = "0.1.0"
description = "FIFA World Cup 2026 Swarm Prediction Engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "openai>=1.30",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "svix>=1.29.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
