# Production Nginx config for SoccerOctupus.
#
# Usage:
#   1. Build the frontend:
#        cd /var/www/SoccerOctupus/frontend && npm ci && npm run build
#   2. Run the Flask backend on 127.0.0.1:5002, for example with systemd/gunicorn.
#   3. Copy or symlink this file to /etc/nginx/sites-available/socceroctupus.
#   4. Update root below if your server path differs.
#   5. Enable it:
#        sudo ln -s /etc/nginx/sites-available/socceroctupus /etc/nginx/sites-enabled/
#        sudo nginx -t
#        sudo systemctl reload nginx

upstream socceroctupus_backend {
    server 127.0.0.1:5002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name socceroctupus.co www.socceroctupus.co;

    # Replace with the absolute path to this repo on your server.
    root /var/www/SoccerOctupus/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    access_log /var/log/nginx/socceroctupus.access.log;
    error_log /var/log/nginx/socceroctupus.error.log;

    # Flask API.
    location /api/ {
        proxy_pass http://socceroctupus_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Backend health endpoint.
    location = /health {
        proxy_pass http://socceroctupus_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Cache immutable Vite build assets.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue router history mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
